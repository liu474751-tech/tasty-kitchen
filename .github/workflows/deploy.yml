name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      DEBIAN_FRONTEND: noninteractive
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_FUND: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies (non-interactive)
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci --silent --no-audit --no-fund --no-progress --legacy-peer-deps;
          else
            npm install --silent --no-audit --no-fund --no-progress --legacy-peer-deps;
          fi

      - name: Generate package-lock.json if missing and commit
        if: "!exists('package-lock.json')"
        run: |
          npm install --package-lock-only --silent --no-audit --no-fund --no-progress || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated by CI" || true
          git push origin main || true

      - name: Show node and npm versions
        run: |
          node -v; npm -v

      - name: List installed packages
        run: |
          npm list --depth=0 || true

      - name: Build
        env:
          VITE_BASE_PATH: '/tasty-kitchen/'
        run: npm run build

      - name: Add CNAME for custom domain
        run: |
          echo "meishitiandi.dpdns.org" > dist/CNAME

      - name: Verify build output
        run: |
          echo "Listing repo root:";
          ls -al || true;
          echo "Listing dist directory:";
          ls -al dist || true
      - name: Ensure gh-pages push permissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ensuring GitHub token available for deployment"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
