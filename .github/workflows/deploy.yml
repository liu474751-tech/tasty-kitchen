## Workflow sync refresh: 2025-11-30
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      DEBIAN_FRONTEND: noninteractive
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_FUND: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Pre-setup diagnostics
        run: |
          echo "=== pre-setup diagnostics ==="
          date || true
          echo "--- environment ---"; env || true
          echo "--- uname ---"; uname -a || true
          echo "--- preinstalled node/npm (if any) ---"; node -v || true; npm -v || true
          echo "--- connectivity to Node hosts ---"; curl -I https://nodejs.org/ || true
          echo "--- connectivity to raw.githubusercontent.com ---"; curl -I https://raw.githubusercontent.com/ || true
          echo "--- DNS resolve ---"; nslookup nodejs.org || true
          echo "--- write to artifact file ---"
          mkdir -p .gha-logs || true
          {
            date || true
            echo "--- environment ---"; env || true
            echo "--- uname ---"; uname -a || true
            echo "--- node/npm ---"; node -v || true; npm -v || true
            echo "--- curl nodejs.org ---"; curl -I https://nodejs.org/ || true
            echo "--- curl raw.githubusercontent.com ---"; curl -I https://raw.githubusercontent.com/ || true
            echo "--- nslookup nodejs.org ---"; nslookup nodejs.org || true
          } > .gha-logs/pre_setup_diag.txt || true

      - name: Upload pre-setup diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-setup-diagnostics
          path: .gha-logs/pre_setup_diag.txt

      - name: Check system Node
        id: check_node
        run: |
          if command -v node >/dev/null 2>&1; then
            ver=$(node -v | sed 's/^v//');
            echo "System node version: $ver";
            echo "has_node=true" >> $GITHUB_OUTPUT;
          else
            echo "has_node=false" >> $GITHUB_OUTPUT;
          fi

      - name: Setup Node.js (only if no suitable system Node)
        if: ${{ steps.check_node.outputs.has_node == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Runner diagnostics
        run: |
          echo "--- runner info ---";
          uname -a || true;
          cat /etc/os-release || true;
          echo "--- disk usage ---"; df -h || true;
          echo "--- network debug (curl) ---"; curl --version || true

      - name: Ensure lockfile in repo (generate on runner if missing)
        run: |
          # If package.json exists but package-lock.json is missing, generate it on the runner
          if [ -f package.json ] && [ ! -f package-lock.json ]; then
            echo "Generating package-lock.json on runner"
            npm --version || true
            node --version || true
            npm i --package-lock-only --no-audit --no-fund --no-progress || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json || true
            if git commit -m "chore(ci): add package-lock.json (generated by CI)"; then
              git push origin HEAD:main || echo "push failed"
            else
              echo "No package-lock to commit"
            fi
          else
            echo "package-lock.json exists or no package.json; skipping"
          fi

      - name: Clean npm cache
        run: |
          npm cache clean --force 2>&1 || true

      - name: Install dependencies (non-interactive)
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --no-progress --legacy-peer-deps;
          else
            npm install --no-audit --no-fund --no-progress --legacy-peer-deps;
          fi

      - name: Show node and npm versions
        run: |
          node -v; npm -v

      - name: List installed packages
        run: |
          npm list --depth=0 || true

      - name: Build (verbose)
        env:
          VITE_BASE_PATH: '/'
        run: |
          set -e
          npm run build 2>&1 | tee build.log

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Ensure build.log exists
        if: always()
        run: |
          if [ -f build.log ]; then echo "build.log present"; else echo "NO BUILD LOG: setup-node likely failed early" > build.log; fi

      - name: Add CNAME for custom domain
        run: |
          echo "meishichufang.meishitiandi.dpdns.org" > dist/CNAME

      - name: Verify build output
        run: |
          echo "Listing repo root:";
          ls -al || true;
          echo "Listing dist directory:";
          ls -al dist || true
      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== build.log ===";
          tail -n 200 build.log || true
      - name: Verify dist index
        run: |
          if [ -f dist/index.html ]; then echo "dist/index.html exists"; else echo "ERROR: dist/index.html missing"; exit 1; fi
      - name: Ensure gh-pages push permissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ensuring GitHub token available for deployment"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
